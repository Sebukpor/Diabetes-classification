<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Diabetes Detection - DAS medhub</title>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --primary-green: #008000;
      --primary-orange: #FFA500;
      --background: #f8f9fa;
      --card-bg: #ffffff;
      --text-dark: #2d3436;
      --input-border: #e0e0e0;
      --shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }

    body {
      font-family: 'Roboto', sans-serif;
      background-color: var(--background);
      margin: 0;
      padding: 2rem;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      color: var(--text-dark);
    }

    .container {
      background-color: var(--card-bg);
      border-radius: 12px;
      box-shadow: var(--shadow);
      max-width: 600px;
      width: 100%;
      padding: 2rem;
    }

    .header {
      text-align: center;
      margin-bottom: 2rem;
    }

    .header-title {
      font-size: 2.5rem;
      font-weight: 700;
      margin: 0;
    }

    .header-title .das {
      color: var(--primary-green);
    }

    .header-title .medhub {
      color: var(--primary-orange);
    }

    .section-title {
      font-size: 1.75rem;
      font-weight: 600;
      text-align: center;
      margin-bottom: 1.5rem;
    }

    form {
      display: grid;
      gap: 1rem;
    }

    form label {
      font-weight: 500;
      margin-bottom: 0.5rem;
      display: block;
    }

    form input,
    form select {
      width: 100%;
      padding: 0.75rem;
      font-size: 1rem;
      border: 2px solid var(--input-border);
      border-radius: 8px;
      transition: border-color 0.3s ease, box-shadow 0.3s ease;
    }

    form input:focus,
    form select:focus {
      border-color: var(--primary-green);
      box-shadow: 0 0 0 3px rgba(0, 128, 0, 0.1);
      outline: none;
    }

    button {
      width: 100%;
      padding: 1rem;
      font-size: 1.1rem;
      font-weight: 500;
      color: #fff;
      background-color: var(--primary-green);
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    button:hover {
      background-color: #006400;
    }

    button:disabled {
      background-color: #cccccc;
      cursor: not-allowed;
    }

    #predictionResult {
      margin-top: 2rem;
      font-size: 1.25rem;
      font-weight: 600;
      text-align: center;
    }
  </style>
  <script>
    // Preprocess the input data
    function preprocessInput(data) {
      const gender = data.gender === 'Female' ? 1 : 0;
      const smoking_history_mapping = {
        'never': 0,
        'former': 1,
        'current': 2,
        'not current': 3,
        'ever': 4,
        'No Info': 5
      };
      const smoking_history = smoking_history_mapping[data.smoking_history];

      // Create the input array
      const inputArray = [
        gender,
        data.age,
        data.hypertension,
        data.heart_disease,
        smoking_history,
        data.bmi,
        data.HbA1c_level,
        data.blood_glucose_level
      ];

      // Mean and standard deviation derived from the training data
      const mean = [
        0.41466,
        41.8858560,
        0.07485,
        0.03942,
        2.17965,
        27.3207671,
        5.527507,
        138.058060
      ];
      const stdDev = [
        0.49302848,
        22.51672729,
        0.26314915,
        0.19459204,
        1.88964967,
        6.63675023,
        1.07066674,
        40.70793251
      ];

      const normalizedInput = inputArray.map((value, index) => (value - mean[index]) / stdDev[index]);
      // Convert the array to a Tensor
      return tf.tensor2d([normalizedInput]);
    }

    // Make the prediction
    async function predictDiabetes() {
      try {
        // Load the TensorFlow.js model (adjust path if necessary)
        const model = await tf.loadGraphModel('mode/model.json');
        console.log("Model loaded successfully!");

        // Collect input data from form fields
        const inputData = {
          gender: document.getElementById('gender').value,
          age: parseFloat(document.getElementById('age').value),
          hypertension: parseInt(document.getElementById('hypertension').value),
          heart_disease: parseInt(document.getElementById('heart_disease').value),
          smoking_history: document.getElementById('smoking_history').value,
          bmi: parseFloat(document.getElementById('bmi').value),
          HbA1c_level: parseFloat(document.getElementById('HbA1c_level').value),
          blood_glucose_level: parseFloat(document.getElementById('blood_glucose_level').value)
        };

        // Preprocess and predict
        const inputTensor = preprocessInput(inputData);
        const prediction = model.predict(inputTensor);

        // Apply sigmoid in case model outputs logits
        const probabilityTensor = tf.sigmoid(prediction);
        const confidence = probabilityTensor.dataSync()[0];

        const classLabels = ["Non-diabetic", "Diabetic"];

        let predictedClass = '';
        let confidenceScore = 0;

        if (confidence > 0.5) {
          predictedClass = classLabels[1]; // Diabetic
          confidenceScore = (confidence * 100).toFixed(2);
        } else {
          predictedClass = classLabels[0]; // Non-diabetic
          confidenceScore = ((1 - confidence) * 100).toFixed(2);
        }

        // Display predicted class and confidence score
        const resultText = `Predicted Class: ${predictedClass} (Confidence: ${confidenceScore}%)`;
        document.getElementById('predictionResult').innerHTML = resultText;
      } catch (error) {
        console.error("Error making prediction:", error);
        document.getElementById('predictionResult').innerHTML = "Error making prediction. Please try again.";
      }
    }
  </script>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1 class="header-title"><span class="das">DAS</span> <span class="medhub">medhub</span></h1>
    </div>

    <h1 class="section-title">Diabetes Detection</h1>
    <form>
      <label for="gender">Gender:</label>
      <select id="gender">
        <option value="Female">Female</option>
        <option value="Male">Male</option>
      </select>

      <label for="age">Age:</label>
      <input type="number" id="age" required>

      <label for="hypertension">Hypertension (0 or 1):</label>
      <input type="number" id="hypertension" min="0" max="1" required>

      <label for="heart_disease">Heart Disease (0 or 1):</label>
      <input type="number" id="heart_disease" min="0" max="1" required>

      <label for="smoking_history">Smoking History:</label>
      <select id="smoking_history">
        <option value="never">Never</option>
        <option value="former">Former</option>
        <option value="current">Current</option>
        <option value="not current">Not Current</option>
        <option value="ever">Ever</option>
        <option value="No Info">No Info</option>
      </select>

      <label for="bmi">BMI:</label>
      <input type="number" id="bmi" step="0.01" required>

      <label for="HbA1c_level">HbA1c Level:</label>
      <input type="number" id="HbA1c_level" step="0.01" required>

      <label for="blood_glucose_level">Blood Glucose Level:</label>
      <input type="number" id="blood_glucose_level" required>

      <button type="button" onclick="predictDiabetes()">Predict Diabetes</button>
    </form>

    <div id="predictionResult">Prediction will appear here.</div>
  </div>
</body>
</html>
