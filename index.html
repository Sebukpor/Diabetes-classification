<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Diabetes Detection - DAS medhub</title>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --primary-green: #008000;
      --primary-orange: #FFA500;
      --background: #f8f9fa;
      --card-bg: #ffffff;
      --text-dark: #2d3436;
      --input-border: #e0e0e0;
      --shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      --error-red: #dc2626;
      --success-green: #16a34a;
    }

    body {
      font-family: 'Roboto', sans-serif;
      background-color: var(--background);
      margin: 0;
      padding: 2rem;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      color: var(--text-dark);
    }

    .container {
      background-color: var(--card-bg);
      border-radius: 12px;
      box-shadow: var(--shadow);
      max-width: 600px;
      width: 100%;
      padding: 2rem;
    }

    .header {
      text-align: center;
      margin-bottom: 2rem;
    }

    .header-title {
      font-size: 2.5rem;
      font-weight: 700;
      margin: 0;
    }

    .header-title .das {
      color: var(--primary-green);
    }

    .header-title .medhub {
      color: var(--primary-orange);
    }

    .section-title {
      font-size: 1.75rem;
      font-weight: 600;
      text-align: center;
      margin-bottom: 1.5rem;
    }

    form {
      display: grid;
      gap: 1.5rem;
    }

    .form-columns {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.5rem;
    }

    .input-group {
      margin-bottom: 1rem;
    }

    form label {
      font-weight: 500;
      margin-bottom: 0.5rem;
      display: block;
    }

    .input-note {
      font-size: 0.875rem;
      color: #666;
      margin-top: 0.25rem;
    }

    form input,
    form select {
      width: 100%;
      padding: 0.75rem;
      font-size: 1rem;
      border: 2px solid var(--input-border);
      border-radius: 8px;
      transition: border-color 0.3s ease, box-shadow 0.3s ease;
    }

    form input:focus,
    form select:focus {
      border-color: var(--primary-green);
      box-shadow: 0 0 0 3px rgba(0, 128, 0, 0.1);
      outline: none;
    }

    .validation-message {
      font-size: 0.875rem;
      color: var(--error-red);
      margin-top: 0.25rem;
    }

    button {
      width: 100%;
      padding: 1rem;
      font-size: 1.1rem;
      font-weight: 500;
      color: #fff;
      background-color: var(--primary-green);
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    button:hover {
      background-color: #006400;
    }

    button:disabled {
      background-color: #cccccc;
      cursor: not-allowed;
    }

    .loading-spinner {
      animation: spin 1s linear infinite;
      display: inline-block;
    }

    @keyframes spin {
      100% { transform: rotate(360deg); }
    }

    .result-card {
      padding: 1.5rem;
      border-radius: 8px;
      margin-top: 2rem;
      display: none;
      text-align: center;
    }

    .result-diabetic {
      background-color: #fee2e2;
      border: 2px solid var(--error-red);
    }

    .result-prediabetic {
      background-color: #fff4e5;
      border: 2px solid var(--primary-orange);
    }

    .result-non-diabetic {
      background-color: #dcfce7;
      border: 2px solid var(--success-green);
    }

    .confidence-bar {
      height: 8px;
      border-radius: 4px;
      margin: 1rem 0;
      background: #e5e7eb;
    }

    .confidence-fill {
      height: 100%;
      border-radius: 4px;
      transition: width 0.5s ease;
    }

    .result-icon {
      font-size: 2rem;
      margin: 1rem 0;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1 class="header-title"><span class="das">DAS</span> <span class="medhub">medhub</span></h1>
    </div>
    <h1 class="section-title">Diabetes Detection</h1>
    <form>
      <div class="form-columns">
        <div class="input-group">
          <label for="gender">Gender:</label>
          <select id="gender">
            <option value="Female">Female</option>
            <option value="Male">Male</option>
            <option value="Other">Other</option>
          </select>
        </div>
        <div class="input-group">
          <label for="age">Age: <span class="input-note">(18-100 years)</span></label>
          <input type="number" id="age" min="18" max="100" required>
          <div class="validation-message"></div>
        </div>
      </div>
      <div class="form-columns">
        <div class="input-group">
          <label for="hypertension">Hypertension: <span class="input-note">(0 or 1)</span></label>
          <input type="number" id="hypertension" min="0" max="1" required>
          <div class="validation-message"></div>
        </div>
        <div class="input-group">
          <label for="heart_disease">Heart Disease: <span class="input-note">(0 or 1)</span></label>
          <input type="number" id="heart_disease" min="0" max="1" required>
          <div class="validation-message"></div>
        </div>
      </div>
      <div class="input-group">
        <label for="smoking_history">Smoking History:</label>
        <select id="smoking_history">
          <option value="No Info">No Info</option>
          <option value="current">current</option>
          <option value="ever">ever</option>
          <option value="former">former</option>
          <option value="never">never</option>
          <option value="not current">not current</option>
        </select>
      </div>
      <div class="form-columns">
        <div class="input-group">
          <label for="bmi">BMI: <span class="input-note">(10.1-99.5)</span></label>
          <input type="number" id="bmi" step="0.01" required>
          <div class="validation-message"></div>
        </div>
        <div class="input-group">
          <label for="HbA1c_level">HbA1c Level: <span class="input-note">(e.g., 5.7)</span></label>
          <input type="number" id="HbA1c_level" step="0.01" required>
          <div class="validation-message"></div>
        </div>
      </div>
      <div class="input-group">
        <label for="blood_glucose_level">Blood Glucose Level: <span class="input-note">(80-300mg/dL)</span></label>
        <input type="number" id="blood_glucose_level" required>
        <div class="validation-message"></div>
      </div>
      <button type="button" onclick="predictDiabetes()" aria-live="polite" aria-busy="false">Predict Diabetes</button>
    </form>
    <div id="predictionResult" role="alert" aria-live="polite"></div>
  </div>

  <script>
    let model;

    async function loadModel() {
      try {
        model = await tf.loadGraphModel('mode/model.json');
        console.log("Model loaded successfully!");
      } catch (error) {
        console.error("Error loading model:", error);
      }
    }
    window.onload = loadModel;

    function preprocessInput(data) {
      let gender;
      if (data.gender === 'Female') gender = 0;
      else if (data.gender === 'Male') gender = 1;
      else if (data.gender === 'Other') gender = 2;
      else gender = 0;

      const smoking_history_mapping = {
        'No Info': 0, 'current': 1, 'ever': 2,
        'former': 3, 'never': 4, 'not current': 5
      };
      const smoking_history = smoking_history_mapping[data.smoking_history];

      const inputArray = [
        gender, data.age, data.hypertension, data.heart_disease,
        smoking_history, data.bmi, data.HbA1c_level, data.blood_glucose_level
      ];

      const mean = [0.41466, 41.885856, 0.07485, 0.03942, 2.17965, 27.3207671, 5.527507, 138.05806];
      const stdDev = [0.49302848, 22.51672729, 0.26314915, 0.19459204, 1.88964967, 6.63675023, 1.07066674, 40.70793251];

      const normalizedInput = inputArray.map((value, index) => (value - mean[index]) / stdDev[index]);
      return tf.tensor2d([normalizedInput]);
    }

    async function predictDiabetes() {
      const btn = document.querySelector('button');
      const resultDiv = document.getElementById('predictionResult');
      try {
        btn.disabled = true;
        btn.innerHTML = '<div class="loading-spinner">⏳</div> Analyzing...';

        const inputData = {
          gender: document.getElementById('gender').value,
          age: parseFloat(document.getElementById('age').value),
          hypertension: parseInt(document.getElementById('hypertension').value),
          heart_disease: parseInt(document.getElementById('heart_disease').value),
          smoking_history: document.getElementById('smoking_history').value,
          bmi: parseFloat(document.getElementById('bmi').value),
          HbA1c_level: parseFloat(document.getElementById('HbA1c_level').value),
          blood_glucose_level: parseFloat(document.getElementById('blood_glucose_level').value)
        };

        const inputTensor = preprocessInput(inputData);
        const prediction = model.predict(inputTensor);
        const probability = prediction.dataSync()[0];

        let predictedClass, confidenceScore;
        // Define thresholds based on diabetic probability:
        // ≥70%: Diabetic, 40%-70%: Prediabetic, <40%: Non-diabetic.
        if (probability >= 0.70) {
          predictedClass = "Diabetic";
          confidenceScore = probability * 100;
        } else if (probability >= 0.40) {
          predictedClass = "Prediabetic";
          confidenceScore = probability * 100;
        } else {
          predictedClass = "Non-diabetic";
          confidenceScore = (1 - probability) * 100;
        }

        let resultClass = "";
        let resultIcon = "";
        let resultNote = "";
        let fillColor = "";
        if (predictedClass === "Diabetic") {
          resultClass = "result-diabetic";
          resultIcon = "❌";
          resultNote = "High risk detected. Please consult a healthcare professional.";
          fillColor = "var(--error-red)";
        } else if (predictedClass === "Prediabetic") {
          resultClass = "result-prediabetic";
          resultIcon = "⚠️";
          resultNote = "Borderline risk. Consider lifestyle changes and consult a professional.";
          fillColor = "var(--primary-orange)";
        } else {
          resultClass = "result-non-diabetic";
          resultIcon = "✅";
          resultNote = "Low risk. Maintain healthy lifestyle habits.";
          fillColor = "var(--success-green)";
        }

        resultDiv.className = `result-card ${resultClass}`;
        resultDiv.innerHTML = `
          <h3>Prediction Result:</h3>
          <div class="result-icon">${resultIcon}</div>
          <h2>${predictedClass}</h2>
          <div class="confidence-bar">
            <div class="confidence-fill" style="width: ${confidenceScore.toFixed(2)}%; background: ${fillColor}">
            </div>
          </div>
          <p>Confidence Level: ${confidenceScore.toFixed(2)}%</p>
          <p class="result-note">${resultNote}</p>
        `;
        resultDiv.style.display = 'block';
      } catch (error) {
        console.error("Error making prediction:", error);
        resultDiv.innerHTML = "Error making prediction. Please try again.";
      } finally {
        btn.disabled = false;
        btn.innerHTML = 'Predict Diabetes';
      }
    }

    // Real-time validation
    document.querySelectorAll('input, select').forEach(element => {
      element.addEventListener('input', () => {
        const validation = element.parentElement.querySelector('.validation-message');
        if (!element.checkValidity()) {
          validation.textContent = element.validationMessage;
        } else {
          validation.textContent = '';
        }
      });
    });
  </script>
</body>
</html>
