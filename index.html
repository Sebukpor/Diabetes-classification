<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Diabetes Detection - DAS medhub</title>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --primary-green: #008000;
      --primary-orange: #FFA500;
      --background: #f8f9fa;
      --card-bg: #ffffff;
      --text-dark: #2d3436;
      --input-border: #e0e0e0;
      --shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }

    body {
      font-family: 'Roboto', sans-serif;
      background-color: var(--background);
      margin: 0;
      padding: 2rem;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      color: var(--text-dark);
    }

    .container {
      background-color: var(--card-bg);
      border-radius: 12px;
      box-shadow: var(--shadow);
      max-width: 600px;
      width: 100%;
      padding: 2rem;
    }

    .header {
      text-align: center;
      margin-bottom: 2rem;
    }

    .header-title {
      font-size: 2.5rem;
      font-weight: 700;
      margin: 0;
    }

    .header-title .das {
      color: var(--primary-green);
    }

    .header-title .medhub {
      color: var(--primary-orange);
    }

    .section-title {
      font-size: 1.75rem;
      font-weight: 600;
      text-align: center;
      margin-bottom: 1.5rem;
    }

    form {
      display: grid;
      gap: 1rem;
    }

    form label {
      font-weight: 500;
      margin-bottom: 0.5rem;
      display: block;
    }

    form input,
    form select {
      width: 100%;
      padding: 0.75rem;
      font-size: 1rem;
      border: 2px solid var(--input-border);
      border-radius: 8px;
      transition: border-color 0.3s ease, box-shadow 0.3s ease;
    }

    form input:focus,
    form select:focus {
      border-color: var(--primary-green);
      box-shadow: 0 0 0 3px rgba(0, 128, 0, 0.1);
      outline: none;
    }

    button {
      width: 100%;
      padding: 1rem;
      font-size: 1.1rem;
      font-weight: 500;
      color: #fff;
      background-color: var(--primary-green);
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    button:hover {
      background-color: #006400;
    }

    button:disabled {
      background-color: #cccccc;
      cursor: not-allowed;
    }

    #predictionResult {
      margin-top: 2rem;
      font-size: 1.25rem;
      font-weight: 600;
      text-align: center;
    }
  </style>
  <script>
    async function loadModel() {
      const modelPath = 'model/model.json';
      try {
        const model = await tf.loadGraphModel(modelPath);
        console.log("Model loaded successfully!");
        return model;
      } catch (error) {
        console.error("Error loading model:", error);
        document.getElementById('predictionResult').innerText = "Error loading model. Please check the path.";
      }
    }

    function preprocessInput(data) {
      const gender = data.gender === 'Female' ? 1 : 0;
      const smoking_history_mapping = {
        'never': 0, 'former': 1, 'current': 2, 'not current': 3, 'ever': 4, 'No Info': 5
      };
      const smoking_history = smoking_history_mapping[data.smoking_history];

      const inputArray = [
        gender, data.age, data.hypertension, data.heart_disease, smoking_history,
        data.bmi, data.HbA1c_level, data.blood_glucose_level
      ];

      const mean = [0.41466, 41.88, 0.074, 0.039, 2.179, 27.32, 5.52, 138.05];
      const stdDev = [0.49, 22.51, 0.26, 0.19, 1.88, 6.63, 1.07, 40.70];

      const normalizedInput = inputArray.map((value, index) => (value - mean[index]) / stdDev[index]);

      return tf.tensor2d([normalizedInput]);
    }

    async function predictDiabetes() {
      const model = await loadModel();
      if (!model) return;

      const inputData = {
        gender: document.getElementById('gender').value,
        age: parseFloat(document.getElementById('age').value),
        hypertension: parseInt(document.getElementById('hypertension').value),
        heart_disease: parseInt(document.getElementById('heart_disease').value),
        smoking_history: document.getElementById('smoking_history').value,
        bmi: parseFloat(document.getElementById('bmi').value),
        HbA1c_level: parseFloat(document.getElementById('HbA1c_level').value),
        blood_glucose_level: parseFloat(document.getElementById('blood_glucose_level').value)
      };

      const inputTensor = preprocessInput(inputData);
      const reshapedInput = inputTensor.reshape([1, inputTensor.shape[1]]);
      
      const prediction = model.predict(reshapedInput);
      const confidenceArray = await prediction.data();
      const confidence = confidenceArray[0];

      const classLabels = ["Non-diabetic", "Diabetic"];
      const predictedClass = confidence > 0.5 ? classLabels[1] : classLabels[0];
      const confidenceScore = (confidence * 100).toFixed(2);

      document.getElementById('predictionResult').innerHTML = `Predicted Class: ${predictedClass} (Confidence: ${confidenceScore}%)`;
    }
  </script>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1 class="header-title"><span class="das">DAS</span> <span class="medhub">medhub</span></h1>
    </div>

    <h1 class="section-title">Diabetes Detection</h1>
    <form>
      <label for="gender">Gender:</label>
      <select id="gender"><option value="Female">Female</option><option value="Male">Male</option></select>

      <label for="age">Age:</label>
      <input type="number" id="age" required>

      <button type="button" onclick="predictDiabetes()">Predict Diabetes</button>
    </form>

    <div id="predictionResult">Prediction will appear here.</div>
  </div>
</body>
</html>
